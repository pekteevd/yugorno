name: Yugorno Mini App 0.6.1 checks

on:
  push:
    branches:
      - temp-upload-miniapp-061
    paths:
      - "mini-app/temp-upload-0.6.1/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/yugorno-miniapp-ci.yml"
  workflow_dispatch:

jobs:
  test-and-start:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini-app/temp-upload-0.6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Check JavaScript syntax
        run: |
          for file in *.js; do
            node --check "$file"
          done
      - name: Build Deployka container image
        run: docker build -f ../../Dockerfile -t yugorno-miniapp-ci ../../
      - name: Start server and check health endpoint
        env:
          NODE_ENV: development
          LOCAL_DEMO_MODE: "true"
          PORT: "3187"
        run: |
          node server.js > /tmp/yugorno-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3187/health > /tmp/yugorno-health.json; then
              break
            fi
            sleep 1
          done
          cat /tmp/yugorno-health.json
          node -e "const h=require('/tmp/yugorno-health.json'); if(!h.ok || h.version!=='0.6.1') process.exit(1)"
